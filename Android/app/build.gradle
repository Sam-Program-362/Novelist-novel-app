plugins {
    id 'com.android.application'
}

android {
    namespace 'app.novelist.re'
    compileSdk 34

    defaultConfig {
        applicationId 'app.novelist.re'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // `generated/webAssets` is filled by syncWebAssets from ../public and ../shared,
            // so the web app and the APK always ship the same code.
            assets.srcDirs = ['src/main/assets', "${layout.buildDirectory.get().asFile}/generated/webAssets"]
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

tasks.register('syncWebAssets', Sync) {
    into layout.buildDirectory.dir('generated/webAssets')
    from("${rootDir}/../public")
    from("${rootDir}/../shared") {
        into 'shared'
    }
    exclude '**/*.map'
}

tasks.named('preBuild') {
    dependsOn 'syncWebAssets'
}
