name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'Android/**'
      - 'public/**'
      - 'shared/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'Android/**'
      - 'public/**'
      - 'shared/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest image already ships the Android SDK with licenses
      # accepted. android-actions/setup-android is not used: it installs the
      # legacy "tools" package, which Google removed, so it fails outright.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Build debug APK
        working-directory: Android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novelist-debug-apk
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
