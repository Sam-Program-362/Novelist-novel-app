name: Build Novelist APK (apk-builder)

on:
  push:
    branches: [ main, freebuff/455862e9a26e7c5c215ab43f ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Detect Android SDK version
        id: sdk
        run: |
          # Try AGP-related files first, then fall back to manifest compileSdk
          if [ -f gradle.properties ]; then
            echo "using gradle project" >> "$GITHUB_OUTPUT"
          fi
          if [ -f build.gradle ] || [ -f build.gradle.kts ] || [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "gradle_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "gradle_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools
        run: |
          echo "Installing Android SDK command-line tools..."
          sudo apt-get update -q
          sudo apt-get install -q -y android-sdk

          # If the runner-provided package does not include cmdline-tools, install manually
          if [ ! -d "$ANDROID_HOME/cmdline-tools" ] && [ ! -d "$ANDROID_HOME/platform-tools" ]; then
            echo "Fallback: installing cmdline-tools manually"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            pushd "$ANDROID_HOME/cmdline-tools"
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
            unzip -q cmdline-tools.zip
            mv cmdline-tools latest || true
            popd
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install required SDK components
        run: |
          set +e
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1
          set -e

      - name: List available Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "PATH includes $ANDROID_HOME/platform-tools"
          ls -la "$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            echo "cmdline-tools present"
            ls -R "$ANDROID_HOME/cmdline-tools"
          else
            echo "no cmdline-tools dir"
          fi

      - name: Build with Gradle (if project present)
        if: steps.sdk.outputs.gradle_present == 'true'
        run: |
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Build README note
        if: always()
        run: |
          echo "## APK Builder workflow" > APK_BUILD_NOTES.md
          echo "" >> APK_BUILD_NOTES.md
          echo "This workflow attempts to build the Android project if a Gradle project exists in the repo." >> APK_BUILD_NOTES.md
          echo "- If `build.gradle(.kts)` / `settings.gradle(.kts)` are present, it runs `./gradlew assembleDebug assembleRelease`." >> APK_BUILD_NOTES.md
          echo "- If no Gradle project is found, the build step is skipped." >> APK_BUILD_NOTES.md
          echo "- JDK 17 is used; the workflow installs Android SDK command-line tools and platforms/build-tools if needed." >> APK_BUILD_NOTES.md

      - name: Upload build notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-builder-notes
          path: APK_BUILD_NOTES.md
          retention-days: 5
