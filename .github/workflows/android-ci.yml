name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Analyze, test and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host SQLite (for Flutter unit tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Flutter version
        run: flutter --version

      - name: Generate Gradle wrapper
        working-directory: app/android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9 --distribution-type bin
            chmod +x gradlew
          fi
          ls -la

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee /tmp/analyze.log

      - name: Unit and widget tests
        working-directory: app
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee /tmp/test.log

      - name: Build release APK
        working-directory: app
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: novelist-rebuild-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      # The build logs themselves are not reachable from restricted networks, so a failed run also
      # publishes the interesting tail of each log as a commit comment. That keeps analyzer and test
      # output readable straight from the API.
      - name: Publish failure details
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=/tmp/failure.md
          {
            echo "CI failed for ${GITHUB_SHA}"
            for name in analyze test build; do
              if [ -s "/tmp/$name.log" ]; then
                echo
                echo "### $name"
                tail -c 4000 "/tmp/$name.log" | sed 's/`/'"'"'/g'
              fi
            done
          } > "$body"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(cat "$body")" || true
