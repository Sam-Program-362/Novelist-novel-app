name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Analyze, test and package APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host SQLite (for Flutter unit tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Gradle wrapper
        working-directory: app/android
        run: |
          if [ ! -f gradlew ]; then
            mkdir -p /tmp/gw && (cd /tmp/gw && gradle wrapper --gradle-version 8.9 --distribution-type bin)
            cp -r /tmp/gw/gradle /tmp/gw/gradlew /tmp/gw/gradlew.bat .
            chmod +x gradlew
          fi
          ls -la

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Unit and widget tests
        working-directory: app
        run: flutter test --reporter expanded

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: novelist-rebuild-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
